name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.19). Defaults to selected ref.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.tag || github.ref_name || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: release_tag
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi

          TAG="$(echo "$TAG" | xargs)"
          if [[ -z "$TAG" ]]; then
            echo "error: empty tag after resolution"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "error: invalid tag format '$TAG' (expected vMAJOR.MINOR.PATCH or prerelease like v1.2.3-rc.1)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0

      - name: Swift package tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./scripts/generate_xcodeproj.sh

      - name: Build release app
        run: |
          xcodebuild \
            -project MDViewer.xcodeproj \
            -scheme MDViewerApp \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/MDViewer.app artifacts/MDViewer.app.zip
          shasum -a 256 artifacts/MDViewer.app.zip > artifacts/MDViewer.app.zip.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            artifacts/MDViewer.app.zip
            artifacts/MDViewer.app.zip.sha256
          body: |
            ## MDViewer release

            This build is currently unsigned and not notarized.
            If Gatekeeper blocks execution, remove quarantine after verifying checksum:

            ```bash
            xattr -dr com.apple.quarantine /Applications/MDViewer.app
            ```

      - name: Sync repository About with this release
        continue-on-error: true
        env:
          REPO_METADATA_TOKEN: ${{ secrets.REPO_METADATA_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ steps.release_tag.outputs.tag }}
        run: ./scripts/sync_repo_about.sh
